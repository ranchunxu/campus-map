<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上海理工大学基础学院 · 校园导览</title>
<meta name="description" content="上海理工大学基础学院军工路1100号校区导览：楼栋定位、出入口、步行路径规划与新生手册。">
<link rel="preload" as="image" href="./data/treefree.webp" fetchpriority="high">
<link rel="preload" as="fetch" href="./data/campus.json" crossorigin="anonymous">
<style>
  /* 首屏就位前铺一层底色，避免白闪（与 body 同色，图到位后被覆盖） */
  html::before{content:'';position:fixed;inset:0;z-index:0;background:#a9c4dd;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:"Microsoft YaHei",sans-serif;background:#a9c4dd;}
  #app{position:relative;width:100%;height:100%;}
  #mapViewport{position:absolute;inset:0;z-index:1;overflow:hidden;cursor:grab;touch-action:none;}
  #mapViewport.dragging{cursor:grabbing;}
  #mapLayer{position:absolute;top:0;left:0;transform-origin:0 0;}
  #mapLayer picture{display:block;}
  #groundImg{display:block;width:1452px;height:1083px;user-select:none;-webkit-user-drag:none;}
  #groundFallback{display:none;}
  #overlay{position:absolute;inset:0;z-index:2;pointer-events:none;}
  .marker{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;z-index:3;width:28px;height:28px;display:flex;align-items:center;justify-content:center;}
  .marker .dot{width:8px;height:8px;border-radius:50%;background:#2f7bff;box-shadow:0 0 0 1.5px rgba(255,255,255,.8),0 1px 2px rgba(0,0,0,.4);}
  .marker .lbl{position:absolute;left:50%;top:11px;transform:translateX(-50%);color:rgba(255,255,255,.95);font-size:10px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.9);padding:0 3px;background:rgba(0,0,0,.42);border-radius:2px;pointer-events:none;}
  .marker.smallLbl .lbl{font-size:9px;padding:0 2px;}
  .marker.pending .dot{background:#fdd663;border-style:dashed;}
  .marker.gate .dot{background:#4aa3ff;}
  .marker.checkin .dot{background:#ff6b6b;}
  .marker.labelOnly .dot{display:none;}
  .marker.labelOnly .lbl{font-size:11px;padding:1px 4px;background:rgba(0,0,0,.55);}
  .marker.highlight .dot{background:#ffb020;box-shadow:0 0 10px rgba(255,176,32,.7);}
  .marker.highlight .lbl{color:#ffd166;font-weight:bold;}
  #meMarkerEl{position:absolute;transform:translate(-50%,-50%);z-index:6;pointer-events:none;}
  #meMarkerEl .dot{width:16px;height:16px;border-radius:50%;background:#2f7bff;border:3px solid #fff;box-shadow:0 0 8px rgba(47,123,255,.6);}
  #routeSvg{position:absolute;inset:0;z-index:4;pointer-events:none;}
  #banner{position:absolute;top:0;left:0;right:0;z-index:20;background:rgba(20,24,32,.88);color:#e8eaed;
    padding:10px 16px;font-size:13px;line-height:1.5;border-bottom:1px solid rgba(255,255,255,.08);}
  #banner b{color:#ffd166;font-size:14px;}
  #banner .note{color:#9aa0a6;}
  #panel{position:absolute;top:74px;right:12px;z-index:20;width:300px;max-height:70vh;overflow:auto;
    background:rgba(25,28,36,.94);color:#e8eaed;border-radius:10px;padding:14px 16px;display:none;
    box-shadow:0 8px 30px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);font-size:13px;line-height:1.7;}
  #panel h3{margin:0 0 8px;font-size:16px;color:#fff;}
  #panel .src{color:#8ab4f8;}
  #panel .conf{color:#fdd663;}
  #panel .close{position:absolute;top:8px;right:12px;cursor:pointer;color:#9aa0a6;font-size:16px;}
  #tip{position:absolute;bottom:12px;left:12px;z-index:20;color:#d5d9de;font-size:12px;
    background:rgba(20,24,32,.7);padding:6px 10px;border-radius:6px;}
  #search{position:absolute;top:74px;left:12px;z-index:20;}
  #search input{width:180px;padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);
    background:rgba(25,28,36,.9);color:#fff;font-size:13px;outline:none;}
  #search .hint{color:#eef;font-size:11px;margin-top:4px;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  #search select{padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(25,28,36,.9);color:#fff;font-size:12px;outline:none;}
  #search .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  #search .row select{flex:1;min-width:0}
  #noResult{color:#f28b82;font-size:11px;margin-top:4px;display:none}
  @media (max-width:640px){
    html,body{background:#eef0f3}
    #banner{font-size:11px;padding:6px 8px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #banner .note{display:none}
    #search{top:44px;left:8px;right:8px;width:auto}
    #search input{width:100%;box-sizing:border-box}
    #panel{top:auto;left:8px;right:8px;width:auto;max-height:42vh;bottom:96px}
    #tip{display:none}
    #routeInfo{left:8px !important;right:8px !important;max-width:none !important;max-height:36vh}
    .toolBar button{padding:5px 6px !important;font-size:11px !important}
    .marker .lbl{font-size:9px;padding:0 2px}
    .marker.smallLbl .lbl{font-size:8px;padding:0 1px}
    .marker.lblAbove .lbl{top:auto;bottom:20px;transform:translateX(20px);}
  }
</style>
</head>
<body>
<div id="app">
  <div id="mapViewport">
    <div id="mapLayer"><picture><source srcset="./data/treefree.webp" type="image/webp"><img id="groundImg" src="./data/treefree.png" alt="校区平面图" fetchpriority="high" decoding="async"></picture></div>
    <svg id="routeSvg"></svg>
    <div id="overlay"></div>
    <div id="meMarkerEl" style="display:none"><div class="dot"></div></div>
  </div>
  <div id="banner"><b id="stTitle">加载中…</b><span id="stNote" class="note"></span></div>
  <div id="search">
    <input id="q" placeholder="搜楼名，如：弘毅苑 / 申三">
    <div class="row">
      <select id="catFilter"><option value="">全部分类</option></select>
      <select id="startPick"><option value="__ph__">请选择起点</option></select>
    </div>
    <div class="hint">回车定位；点标记看信息；拖动平移</div>
    <div id="noResult">未找到该地点</div>
  </div>
  <div id="panel"><span class="close" onclick="closePanel()">✕</span><div id="panelBody"></div></div>
  <div id="tip">拖动平移 · 点标记看信息</div>
</div>
<script type="module">
// ---------- 数据 ----------
// 底图 265KB 走 <picture> 先渲染，JSON 三件并行拉；全部就位再初始化交互
const [resp, phmResp, roadNetResp] = await Promise.all([
  fetch('./data/campus.json'),
  fetch('./data/place_handbook_map.json'),
  fetch('./data/road_network.json'),
]);
const data = await resp.json();
const phm = await phmResp.json();
const roadNet = await roadNetResp.json();
const meta = data.meta;
const HIDDEN = new Set(['b03','b14','c01','c02','c03']);
const feats = data.features.filter(f => f.kind === 'road' || !HIDDEN.has(f.id));
const [oLon, oLat] = meta.projection.originLonLatGCJ02;
const M_LAT = meta.projection.mPerDegLat, M_LON = meta.projection.mPerDegLon;
function proj(lon, lat){ return [(lon-oLon)*M_LON, (lat-oLat)*M_LAT]; }
const byId = {};
for (const f of feats) byId[f.id] = f;
const CAT_LABEL = {dorm:'宿舍', teaching:'教学楼', food:'餐饮', sport:'体育', service:'服务'};
(function fillFilters(){
  const cf = document.getElementById('catFilter');
  [...new Set(feats.filter(f=>f.kind==='building'&&f.category).map(f=>f.category))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=CAT_LABEL[c]||c; cf.appendChild(o);});
  // 起点下拉：包含所有可导航地点（楼栋 + 出入口），ID 与名称永久一一对应
  const sp = document.getElementById('startPick');
  const NAV_KINDS = new Set(['building', 'gate']);
  feats.filter(f => NAV_KINDS.has(f.kind)).forEach(f=>{
    const o=document.createElement('option'); o.value=f.id; o.textContent=f.name; sp.appendChild(o);});
})();

document.getElementById('stTitle').textContent = meta.campus + ' · 2026级本科新生 · ' + meta.dataStatus;
document.getElementById('stNote').textContent = ' — ' + meta.statusNote;

// ---------- 坐标转换（localMeters → 底图像素） ----------
// transform: sxMPerPx=0.6408, syMPerPx=1.043, cropOffsetPx=[-868.31,-193.86], anchorPx=[0,0]
// xM = sxMPerPx*(px + cropOffsetPx[0] - anchorPx[0]) => px = (xM/sxMPerPx) - cropOffsetPx[0] + anchorPx[0]
// zM: Three.js z=-zM, cz=(cropOffsetPx[1]+py-anchorPx[1])*syMPerPx, z=cz => -zM = syMPerPx*(py+cropOffsetPx[1]-anchorPx[1])
// => py = (-zM/syMPerPx) - cropOffsetPx[1] + anchorPx[1] = (202.19-zM)/1.043
const TF_A = 0.445736, TF_B = -556.41, TF_C = -0.725188, TF_D = 202.19;
// 底图标注坐标（从底图文字标注读取或微调对齐，已按新底图1452×1083缩放）
const PX_OVERRIDE = {
  b01:[477,219], b02:[316,288], b04:[252,345], b05:[467,446],
  b06:[575,302], b07:[632,310], b08:[748,331], b09:[618,394],
  b10:[748,446], b11:[992,302], b12:[992,489],
  b13:[1350,50], b15:[1040,838], b16:[1180,930], b17:[1006,956], b18:[769,956],
  b19:[510,899], b20:[252,956], b21:[116,910], b22:[305,466], b23:[275,720],
  b24:[518,699], b25:[743,673], b26:[526,788], b30:[1251,748],
  b31:[1290,410],
  g01:[94,834], g02:[109,671], g03:[1130,130],
};
const PENDING = new Set(['b01','b02','b04','b05','b06','b07','b08','b09','b10','b11','b12','b15','b16','b17','b18','b19','b20','b21','b22','b23','b24','b25','b26','b30','b31','g01','g02','g03']);

function featPx(f) {
  if (PX_OVERRIDE[f.id]) return PX_OVERRIDE[f.id];
  if (f.kind === 'building' && f.footprint && f.footprint.localMeters) {
    let cx = 0, cy = 0;
    for (const [x, y] of f.footprint.localMeters) { cx += x; cy += y; }
    cx /= f.footprint.localMeters.length; cy /= f.footprint.localMeters.length;
    return [(cx - TF_B) / TF_A, (TF_D - cy) / (-TF_C)];
  }
  if (f.position && f.position.localMeters) {
    const [xM, zM] = f.position.localMeters;
    return [(xM - TF_B) / TF_A, (TF_D - zM) / (-TF_C)];
  }
  if (f.position && f.position.lonlat) {
    const [ex, ny] = proj(...f.position.lonlat);
    return [(ex - TF_B) / TF_A, (TF_D - ny) / (-TF_C)];
  }
  return null;
}
// {x,z}（Three.js风格，z=-zM）→ 像素
function xz2px(x, z) { return [(x - TF_B) / TF_A, (z + TF_D) / (-TF_C)]; }
// 像素 → {x,z}
function px2xz(px, py) { return [px * TF_A + TF_B, py * (-TF_C) - TF_D]; }

// ---------- 2D 地图交互 ----------
const mapViewport = document.getElementById('mapViewport');
const mapLayer = document.getElementById('mapLayer');
const overlay = document.getElementById('overlay');
const routeSvg = document.getElementById('routeSvg');
const meMarkerEl = document.getElementById('meMarkerEl');
// 矢量路线层：路网预览层（默认隐藏）+ 导航路线层
const SVGNS = 'http://www.w3.org/2000/svg';
const netLayer = document.createElementNS(SVGNS, 'g');
netLayer.setAttribute('id', 'netLayer');
netLayer.style.display = 'none';
routeSvg.appendChild(netLayer);
const routeLayer = document.createElementNS(SVGNS, 'g');
routeLayer.setAttribute('id', 'routeLayer');
routeSvg.appendChild(routeLayer);
// 折线 → 带小圆角的 SVG path（直线保持直，圆角只作用于转弯显示，不改变图节点/连通关系）
function roundPath(pts, r) {
  if (!pts || pts.length < 2) return '';
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i-1], p1 = pts[i], p2 = pts[i+1];
    const v1x = p0[0]-p1[0], v1y = p0[1]-p1[1], v2x = p2[0]-p1[0], v2y = p2[1]-p1[1];
    const l1 = Math.hypot(v1x, v1y), l2 = Math.hypot(v2x, v2y);
    const rr = Math.min(r, l1/2, l2/2);
    if (rr < 0.5 || l1 < 1e-6 || l2 < 1e-6) { d += ` L ${p1[0]} ${p1[1]}`; continue; }
    const ax = p1[0] + v1x/l1*rr, ay = p1[1] + v1y/l1*rr;
    const bx = p1[0] + v2x/l2*rr, by = p1[1] + v2y/l2*rr;
    d += ` L ${ax} ${ay} Q ${p1[0]} ${p1[1]} ${bx} ${by}`;
  }
  const last = pts[pts.length-1];
  return d + ` L ${last[0]} ${last[1]}`;
}
// 按 style 统一：白描边 + 红芯、圆头圆角
function drawStyledPath(parent, pts, r) {
  const d = roundPath(pts, r);
  if (!d) return null;
  const st = roadNet.style || {};
  const outer = document.createElementNS(SVGNS, 'path');
  outer.setAttribute('d', d); outer.setAttribute('fill', 'none');
  outer.setAttribute('stroke', st.outerColor || '#ffffff');
  outer.setAttribute('stroke-width', st.outerWidth || 14);
  outer.setAttribute('stroke-linecap', 'round'); outer.setAttribute('stroke-linejoin', 'round');
  const inner = document.createElementNS(SVGNS, 'path');
  inner.setAttribute('d', d); inner.setAttribute('fill', 'none');
  inner.setAttribute('stroke', st.innerColor || '#ff1c26');
  inner.setAttribute('stroke-width', st.innerWidth || 7);
  inner.setAttribute('stroke-linecap', 'round'); inner.setAttribute('stroke-linejoin', 'round');
  parent.appendChild(outer); parent.appendChild(inner);
  return {outer, inner};
}
let scale = 0.5, offsetX = 0, offsetY = 0;

function fitMap() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const narrow = vw <= 640;
  if (narrow) {
    const sr = document.getElementById('search').getBoundingClientRect();
    const top = sr.bottom + 4;
    scale = vw / 1452;
    const gh = 1083 * scale;
    offsetX = 0;
    offsetY = 0;
    mapViewport.style.top = top + 'px';
    mapViewport.style.bottom = 'auto';
    mapViewport.style.height = gh + 'px';
    const tbTop = top + gh + 4;
    toolBar.style.top = tbTop + 'px';
    toolBar.style.bottom = 'auto';
    const tbH = toolBar.getBoundingClientRect().height;
    const belowTb = tbTop + tbH + 4;
    locStatus.style.top = belowTb + 'px';
    locStatus.style.bottom = 'auto';
    relayoutBelow();
    const footer = document.getElementById('footer');
    if (footer) footer.style.display = 'block';
  } else {
    mapViewport.style.top = '';
    mapViewport.style.bottom = '';
    mapViewport.style.height = '';
    toolBar.style.top = '';
    toolBar.style.bottom = '12px';
    routeInfo.style.top = '';
    routeInfo.style.bottom = '44px';
    routeInfo.style.maxHeight = '';
    locStatus.style.top = '';
    locStatus.style.bottom = '52px';
    const panel = document.getElementById('panel');
    if (panel) { panel.style.top = ''; panel.style.bottom = ''; panel.style.maxHeight = ''; }
    const footer = document.getElementById('footer');
    if (footer) footer.style.display = 'none';
    const padTop = 164, padBottom = 44;
    const availH = vh - padTop - padBottom;
    scale = Math.min(vw / 1452, availH / 1083);
    offsetX = (vw - 1452 * scale) / 2;
    offsetY = padTop + (availH - 1083 * scale) / 2;
  }
  updateTransform();
}
function clampOffset() {
  const vw = mapViewport.clientWidth, vh = mapViewport.clientHeight;
  const gw = 1452 * scale, gh = 1083 * scale;
  if (gw >= vw) offsetX = Math.max(-(gw - vw), Math.min(0, offsetX));
  else offsetX = Math.max(0, Math.min(vw - gw, offsetX));
  if (gh >= vh) offsetY = Math.max(-(gh - vh), Math.min(0, offsetY));
  else offsetY = Math.max(0, Math.min(vh - gh, offsetY));
}
function updateTransform() {
  clampOffset();
  mapLayer.style.transform = `translate(${offsetX}px,${offsetY}px) scale(${scale})`;
  for (const m of markerList) {
    m.el.style.left = (m.px * scale + offsetX) + 'px';
    m.el.style.top = (m.py * scale + offsetY) + 'px';
  }
  routeSvg.setAttribute('width', mapViewport.clientWidth);
  routeSvg.setAttribute('height', mapViewport.clientHeight);
  const tf = `translate(${offsetX},${offsetY}) scale(${scale})`;
  if (routeLayer) routeLayer.setAttribute('transform', tf);
  netLayer.setAttribute('transform', tf);
  if (mePx) {
    meMarkerEl.style.left = (mePx[0] * scale + offsetX) + 'px';
    meMarkerEl.style.top = (mePx[1] * scale + offsetY) + 'px';
  }
}
// 拖动
let dragging = false, dragX0, dragY0, offX0, offY0, moved = 0;
mapViewport.addEventListener('mousedown', e => {
  dragging = true; moved = 0;
  dragX0 = e.clientX; dragY0 = e.clientY; offX0 = offsetX; offY0 = offsetY;
  mapViewport.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - dragX0, dy = e.clientY - dragY0;
  moved = Math.max(moved, Math.hypot(dx, dy));
  offsetX = offX0 + dx; offsetY = offY0 + dy;
  updateTransform();
});
window.addEventListener('mouseup', e => {
  if (!dragging) return;
  dragging = false; mapViewport.classList.remove('dragging');
  if (moved < 5) handleMapClick(e);
});

// 触屏
let touchState = null;
mapViewport.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    touchState = {type:'pan', x:e.touches[0].clientX, y:e.touches[0].clientY, ox:offsetX, oy:offsetY, moved:0};
  } else if (e.touches.length === 2) {
    touchState = {type:'pinch'};
  }
}, {passive: false});
mapViewport.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touchState) return;
  if (touchState.type==='pan' && e.touches.length===1) {
    const dx=e.touches[0].clientX-touchState.x, dy=e.touches[0].clientY-touchState.y;
    touchState.moved = Math.max(touchState.moved, Math.hypot(dx,dy));
    offsetX=touchState.ox+dx; offsetY=touchState.oy+dy; updateTransform();

  }
}, {passive: false});
mapViewport.addEventListener('touchend', e => {
  if (touchState && touchState.type==='pan' && touchState.moved<5 && e.changedTouches.length===1) {
    const rect=mapViewport.getBoundingClientRect();
    handleMapClick({clientX:e.changedTouches[0].clientX, clientY:e.changedTouches[0].clientY});
  }
  touchState = null;
});

function handleMapClick(e) {
  const rect = mapViewport.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  // 检查是否点中标记
  for (const m of markerList) {
    const mx = m.px * scale + offsetX, my = m.py * scale + offsetY;
    if (Math.hypot(sx - mx, sy - my) < 15) { showPanel(m.f); return; }
  }
  // 点选位置模式
  if (pickMode) {
    const [x, z] = px2xz((sx - offsetX) / scale, (sy - offsetY) / scale);
    setMyLocal(x, -z, '点选位置');
  }
}

// ---------- 地点标记 ----------
const markerList = [];
for (const f of feats) {
  const px = featPx(f);
  if (!px) continue;
  const el = document.createElement('div');
  el.className = 'marker' + (f.kind === 'gate' ? ' gate' : f.kind === 'checkin' ? ' checkin' : '') + (PENDING.has(f.id) ? ' pending' : '') + (f.id === 'b13' ? ' labelOnly' : '') + (f.id === 'b07' ? ' lblAbove' : '') + (f.id === 'b06' || f.id === 'b07' ? ' smallLbl' : '');
  el.innerHTML = `<div class="dot"></div><div class="lbl">${f.name}</div>`;
  el.title = f.name + (PENDING.has(f.id) ? '（位置待核实）' : '');
  overlay.appendChild(el);
  markerList.push({f, px: px[0], py: px[1], el});
}

// ---------- 地点详情面板 ----------
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
window.panel = panel;
function showPanel(f) {
  if (!f) { closePanel(); return; }
  for (const m of markerList) m.el.classList.toggle('highlight', m.f === f);
  let html = `<h3>${f.name}</h3>`;
  const catName = {dorm:'宿舍', teaching:'教学楼', food:'餐饮', sport:'体育', service:'服务'}[f.category] || '';
  if (catName) html += `<div>类型：${catName}</div>`;
  if (f.nameSource) html += `<div class="src">楼名来源：${f.nameSource}</div>`;
  if (f.footprintSource) html += `<div class="src">位置来源：${f.footprintSource}</div>`;
  if (f.confidence) html += `<div class="conf">可信度：${JSON.stringify(f.confidence).replace(/["{}]/g,' ').trim()}</div>`;
  if (f.status) html += `<div class="conf">状态：${f.status}</div>`;
  if (PENDING.has(f.id)) html += `<div class="conf">⚠ 位置待核实（基于旧坐标换算，未与底图精确对齐）</div>`;
  html += `<div style="color:#9aa0a6;margin-top:6px">编号 ${f.id}</div>`;

  }

// ---------- 定位（GPS WGS84→GCJ02 / 点选模拟）+ 跟随 ----------
function wgs2gcj(lon, lat) {
  const a = 6378245.0, ee = 0.00669342162296594323;
  const tl = (x, y) => {
    let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
    r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI)) * 2/3;
    r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2/3;
    return r;
  };
  const tg = (x, y) => {
    let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
    r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI)) * 2/3;
    r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2/3;
    return r;
  };
  if (lon < 73.66 || lon > 135.05 || lat < 3.86 || lat > 53.55) return [lon, lat];
  const dlat = tl(lon-105, lat-35), dlon = tg(lon-105, lat-35);
  const rad = lat/180*Math.PI, magic = 1 - ee*Math.sin(rad)**2, sq = Math.sqrt(magic);
  return [lon + dlon*180/(a/sq*Math.cos(rad)*Math.PI),
          lat + dlat*180/((a*(1-ee))/(magic*sq)*Math.PI)];
}

}

function buildNetworkPreview() {

    const inner = document.createElementNS(SVGNS, 'path');
    inner.setAttribute('d', d); inner.setAttribute('fill', 'none');

    inner.setAttribute('stroke-width', st.innerWidth || 7);
    inner.setAttribute('stroke-linecap', 'round'); inner.setAttribute('stroke-linejoin', 'round');
    group.appendChild(outer); group.appendChild(inner);
  }

}

let locWatchId = null;
function toggleGps(force) {
  const on = (force === undefined) ? locWatchId === null : !!force;

    showStatus('已停止定位');

  if (!navigator.geolocation) { showStatus('此环境不支持定位；可用 debug.pick() 模拟'); return false; }
  locWatchId = navigator.geolocation.watchPosition(
    pos => {
      const [glon, glat] = wgs2gcj(pos.coords.longitude, pos.coords.latitude);
      const [e, n] = proj(glon, glat);
      setMyLocal(e, n, 'GPS（精度约 ' + Math.round(pos.coords.accuracy) + ' 米）');
    },
    err => showStatus('定位失败：' + err.message + '。手机浏览器要 HTTPS 才给定位，可用 debug.pick() 模拟。'),
    {enableHighAccuracy: true, maximumAge: 2000});
  return true;
}

function updateNavProgress() {
  if (!lastRoute || !mePx) return;
  const [x, z] = px2xz(mePx[0], mePx[1]);
  const me = {x, z};
  // 用最终显示路径（像素）逐段求最近投影点，估算已走距离
  let acc = 0, bestD = 1e18, bestTraveled = 0;
  const pts = routePts.map(p => px2xz(p[0], p[1]));
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i-1], b = pts[i];
    const abx = b[0]-a[0], abz = b[1]-a[1], abLen = Math.hypot(abx, abz);
    if (abLen < 1e-9) continue;
    const t = Math.max(0, Math.min(1, ((me.x-a[0])*abx + (me.z-a[1])*abz) / (abLen*abLen)));
    const px = a[0] + abx*t, pz = a[1] + abz*t;
    const d = Math.hypot(me.x-px, me.z-pz);
    if (d < bestD) { bestD = d; bestTraveled = acc + abLen*t; }
    acc += abLen;
  }
  offRouteM = bestD; traveledM = bestTraveled;
  renderRoute();
}

window.__nav = {
  byId, showPanel, closePanel, renderRoute, clearRoute,
  get baseNodeCount() { return baseNodes.length; },
  get baseEdgeCount() { return baseAdj.reduce((s, l) => s + l.length, 0); },
  get navState() { return navState; },
  get routeStartName() { return routeStartName; },
  get routeEndName() { return routeEndName; },
  startOptionCount() { const sp = document.getElementById('startPick'); let n = 0; for (const o of sp.options) if (o.value && o.value !== '__ph__') n++; return n; },
  setStart: id => setRouteStartById(id),
  setEnd: id => setRouteEndById(id),
  routeEndpointsPx() {
    if (!routePts.length) return null;
    const f = routePts[0], l = routePts[routePts.length-1];
    return {first: [Math.round(f[0]), Math.round(f[1])], last: [Math.round(l[0]), Math.round(l[1])]};
  },
  featPxById(id) { const f = byId[id]; if (!f) return null; const p = featPx(f); return p ? [Math.round(p[0]), Math.round(p[1])] : null; },
  sameRoadTest() {
    const r2 = (rx, ry) => { const [x, z] = px2xz(rx*1452/1451, ry*1083/1084); return {x, z}; };
    const S = r2(450, 566), T = r2(500, 566);
    const g = buildTempGraph(S, T);
    const r = dijkstra(g, g.sIdx, g.tIdx);
    if (!r) return {error: 'no route', sIdx: g.sIdx, tIdx: g.tIdx, n: g.nodes.length};
    const xs = r.path.map(i => Math.round(xz2px(g.nodes[i].x, g.nodes[i].z)[0]));
    return {meters: r.dist, xs};
  },
  // 隔离路网测试：只复制一条直线边，起终点在同一内部投影点 → 期望 same、距离 0；断开则不可达
  isolatedSamePlaceTest() {
    const saveN = baseNodes, saveA = baseAdj;
    baseNodes = [{x: 0, z: 0}, {x: 100, z: 0}];
    baseAdj = [[[1, 100, '校园道路']], [[0, 100, '校园道路']]];
    const g = buildTempGraph({x: 50, z: 0}, {x: 50, z: 0});
    const res = {same: g.same, dist: g.same ? 0 : null, sIdx: g.sIdx, tIdx: g.tIdx, nodeCount: g.nodes.length};
    // 断开：移除起点所有出边 → 预期不可达
    const g2 = buildTempGraph({x: 10, z: 0}, {x: 90, z: 0});
    g2.adj = g2.adj.map((l, i) => i === g2.sIdx ? [] : l);
    const r2 = dijkstra(g2, g2.sIdx, g2.tIdx);
    res.unreachableWhenCut = !r2;
    baseNodes = saveN; baseAdj = saveA;
    return res;
  },
};
