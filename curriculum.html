<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本科培养计划查询 · 上理工2026级</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--border:#e3e6eb;--primary:#1a73e8;--text:#1f2329;--muted:#6b7280;--warn:#b54708;--warnbg:#fff7ed}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:10}
header h1{font-size:18px;font-weight:600}
header .back{float:right;color:var(--primary);text-decoration:none;font-size:14px}
.notice{background:var(--warnbg);color:var(--warn);padding:8px 20px;font-size:13px;border-bottom:1px solid #fde68a}
.container{max-width:1100px;margin:0 auto;padding:16px}
.filters{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.filters label{font-size:13px;color:var(--muted)}
.filters select,.filters input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px}
.filters select{min-width:180px}
.filters input{flex:1;min-width:160px}
.filters .count{margin-left:auto;font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:13px}
th,td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left}
th{background:#f1f3f4;font-weight:500;position:sticky;top:60px}
tr:hover{background:#f8faff}
td.code{font-family:Consolas,monospace;color:var(--muted);font-size:12px}
td.credit{text-align:center}
td.exam{font-size:12px}
td.term{font-size:12px;color:var(--primary)}
td.cat{font-size:12px;color:var(--muted)}
.no-result{padding:40px 20px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:8px}
.no-result h3{color:var(--warn);margin-bottom:8px}
.source-info{font-size:12px;color:var(--muted);margin-top:12px;padding:8px 12px;background:#f8faff;border-radius:6px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px}
@media(max-width:768px){.filters{flex-direction:column;align-items:stretch}.filters select,.filters input{width:100%}.filters .count{margin-left:0}th,td{padding:6px 4px;font-size:12px}th{position:static !important;top:auto !important}td.code{display:none}th.code{display:none}table{min-width:600px}}
</style>
</head>
<body>
<header>
<a class="back" href="/">← 返回地图</a>
<h1>本科培养计划查询</h1>
</header>
<div class="notice">⚠️ 数据来源：2026级本科培养计划（上册440页+下册448页+通识附表4页+学科基础附表4页）。课程字段（代码/名称/学分/学时/考核/学期/必修选修/方向模块）逐项来自PDF文本抽取。短学期(短N)已保留。学时=总/理论/实验（实习以周计）。必修选修按子模块标题/通识附表原文标注，PDF未标明者记"原文未标明"不推断。方向模块为任选其一。动态安排以教务系统为准。覆盖电子与信息类13个分流专业。</div>
<div class="container">
<div class="filters">
<label>专业</label>
<select id="prof"></select>
<label>学期</label>
<select id="term">
<option value="">全部学期</option>
<option value="一/1">大一上 一/1</option>
<option value="一/2">大一下 一/2</option>
<option value="二/1">大二上 二/1</option>
<option value="二/2">大二下 二/2</option>
<option value="三/1">大三上 三/1</option>
<option value="三/2">大三下 三/2</option>
<option value="四/1">大四上 四/1</option>
<option value="四/2">大四下 四/2</option>
<option value="短">含短学期</option>
</select>
<label>类别</label>
<select id="cat">
<option value="">全部类别</option>
<option value="通识教育课程">通识教育课程</option>
<option value="学科基础课程">学科基础课程</option>
<option value="专业课程">专业课程</option>
<option value="任选课程">任选课程</option>
<option value="集中性实践环节">集中性实践环节</option>
</select>
<input id="search" placeholder="按课程名称搜索…">
<span class="count" id="count"></span>
</div>
<div id="result"></div>
<div class="source-info" id="sourceInfo"></div>
</div>
<script>
let DATA={};
const profEl=document.getElementById('prof');
const termEl=document.getElementById('term');
const catEl=document.getElementById('cat');
const searchEl=document.getElementById('search');
const resultEl=document.getElementById('result');
const countEl=document.getElementById('count');
const sourceInfoEl=document.getElementById('sourceInfo');
fetch('data/curriculum_eit.json').then(r=>r.json()).then(d=>{
  DATA=d;
  const profs=Object.keys(d);
  profs.forEach(p=>{
    const o=document.createElement('option');
    o.value=p;o.textContent=p;
    profEl.appendChild(o);
  });
  profEl.onchange=termEl.onchange=catEl.onchange=searchEl.oninput=render;
  render();
});
function render(){
  const prof=profEl.value;
  if(!prof){resultEl.innerHTML='<div class="no-result"><p>请选择一个专业查看培养计划。</p></div>';countEl.textContent='';return;}
  const info=DATA[prof];
  let courses=info.courses||[];
  const term=termEl.value,cat=catEl.value,kw=searchEl.value.trim().toLowerCase();
  if(term){
    if(term==='短') courses=courses.filter(c=>/\(短\d+\)/.test(c.term||''));
    else courses=courses.filter(c=>c.term===term || (c.term||'').startsWith(term+'('));
  }
  if(cat)courses=courses.filter(c=>c.category===cat);
  if(kw)courses=courses.filter(c=>c.name.toLowerCase().includes(kw));
  countEl.textContent='共 '+courses.length+' 门';
  sourceInfoEl.textContent='来源：2026级本科培养计划 '+info.vol+' 第'+info.pages+'页 · PDF文本抽取 · 学时=总/理论/实验（实习以周计）· 短学期(短N)已保留 · 必修选修按子模块标题/通识附表原文，未标明者记"原文未标明" · 方向模块任选其一';
  if(!courses.length){
    resultEl.innerHTML='<div class="no-result"><h3>现有资料未查到</h3><p>没有匹配「'+prof+'」'+(term?' '+term:'')+(cat?' '+cat:'')+(kw?' 含「'+searchEl.value+'」':'')+' 的课程。</p><p style="margin-top:8px">本数据为PDF抽取草稿，可能存在遗漏。请以教务系统为准：<a href="https://jwc.usst.edu.cn/" target="_blank">jwc.usst.edu.cn</a></p></div>';
    return;
  }
  let html='<div class="table-wrap"><table><thead><tr><th class="code">代码</th><th>课程名称</th><th>学分</th><th>学时(总/理/实)</th><th>考核</th><th>建议学期</th><th>类别</th><th>必修选修</th><th>方向模块</th></tr></thead><tbody>';
  courses.forEach(c=>{
    const hours=(c.total_hours||c.theory_hours||c.lab_hours)?(c.total_hours||'-')+'/'+(c.theory_hours||'-')+'/'+(c.lab_hours||'-'):'-';
    const mod=c.module?('【'+c.module+'】'):'';
    const rq=c.required||'';
    const rqStyle=rq==='必修'?'color:#1a7f37':rq==='选修'?'color:#b54708':rq==='限选'?'color:#1a73e8':'color:var(--muted)';
    html+='<tr><td class="code">'+c.code+'</td><td>'+c.name+(mod?'<div style="font-size:11px;color:var(--warn);margin-top:2px">'+mod+'任选其一</div>':'')+'</td><td class="credit">'+c.credit+'</td><td class="code">'+hours+'</td><td class="exam">'+(c.exam||'')+'</td><td class="term">'+(c.term||'')+'</td><td class="cat">'+(c.category||'')+'</td><td class="cat" style="'+rqStyle+'">'+rq+'</td><td class="cat">'+(c.module||'')+'</td></tr>';
  });
  html+='</tbody></table></div>';
  resultEl.innerHTML=html;
}
</script>
</body>
</html>
